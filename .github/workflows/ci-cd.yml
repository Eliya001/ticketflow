name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "services/**"
      - ".github/workflows/ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "services/**"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  ACR_LOGIN_SERVER: acrticketflowdeveliya.azurecr.io

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  lint-and-test:
    name: Lint & test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: frontend
          - service: booking-api
            context: services/booking-api
          - service: seat-inventory
            context: services/seat-inventory
          - service: payment-mock
            context: services/payment-mock
          - service: notification-worker
            context: services/notification-worker
    steps:
      - uses: actions/checkout@v4

      - name: Detect Node project
        id: detect-node
        run: |
          if [ -f "${{ matrix.context }}/package.json" ]; then
            echo "is_node=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_node=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Detect Python project
        id: detect-python
        run: |
          if [ -f "${{ matrix.context }}/requirements.txt" ] || [-f "${{ matrix.context }}/pyproject.toml" ]; then
            echo "is_python=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_python=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node
        if: steps.detect-node.outputs.is_node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.context }}/package-lock.json
      - name: Install Node deps
        if: steps.detect-node.outputs.is_node == 'true'
        working-directory: ${{ matrix.context }}
        run: npm ci

      - name: Lint (node)
        if: steps.detect-node.outputs.is_node == 'true'
        working-directory: ${{ matrix.context }}
        run: npm run lint --if-present

      - name: Test (Node)
        if: steps.detect-node.outputs.is_node == 'true'
        working-directory: ${{ matrix.context }}
        run: npm test --if-present -- --ci
        continue-on-error: true

      - name: Set up Python
        if: steps.detect-python.outputs.is_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Python deps
        if: steps.detect-python.outputs.is_python == 'true'
        working-directory: $${{ matrix.context }}
        run: |
          python -m pip install --upgrade pip
          [ -f requirements.txt ] && pip install -r requirements.txt || true
          pip install flake8 pytest --quiet

      - name: Lint (Python)
        if: steps.detect-python.outputs.is_python == 'true'
        working-directory: ${{ matrix.context }}
        run: |
          if find . -name "test_*.py" -o -name "*_test.py" | grep -q .; then
            pytest
          else
            echo "No Python tests found, skipping"
          fi
  build-scan-push:
    name: Build & scan (${{ matrix.service }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [secret-scan, lint-and-test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: frontend
          - service: booking-api
            context: services/booking-api
          - service: seat-inventory
            context: services/seat-inventory
          - service: payment-mock
            context: services/payment-mock
          - service: notification-worker
            context: services/notification-worker
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_LOGIN_SERVER }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ steps.vars.outputs.tag }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ steps.vars.outputs.tag }}
          format: "sarif"
          output: "trivy-${{ matrix.service }}.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codesql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-${{ matrix.service }}.sarif"
          category: "trivy-${{ matrix.service }}"

      - name: Fail build on CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ steps.vars.outputs.tag }}
          format: "table"
          severity: "CRITICAL"
          exit-code: "1"
          ignore-unefixed: true

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ steps.vars.outputs.tag }}
          format: spdx-json
          output-file: "sbom-${{ matrix.service }}.spdx.json"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: "sbom-${{ matrix.service }}.spdx.json"
          retention-days: 30

      - name: Push image to ACR
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ steps.vars.output.tag }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}

  update-manifests:
    name: Update image tags for GitOps
    if: github.event_name == 'push'
    needs: [build-scan-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tag
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Install yq
        run: |
          sudo wget -q0 /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Bump image tags in k8s manifests
        run: |
          for svc in frontend booking-api seat-inventory payment-mock notification-worker; do
            file="k8s/${svc}/deployment.yaml"
            if [ -f "$file" ]; then
              yq -i ".spec.template.spec.containers[0].image = \"${{ env.ACR_LOGIN_SERVER }}/${svc}:${{ steps.vars.outputs.tag }}\""
            fi
          done

      - name: Commit and push updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/
          git diff --cached --quiet || git commit -m "ci: bump image tags to ${{ steps.vars.outputs.tag }} [skip ci]"
          git push
